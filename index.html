<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sirena · Editor de diagramas Mermaid</title>
<meta name="description" content="Editor libre de diagramas Mermaid que funciona por completo en el navegador, sin cuenta ni servidor.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/sirena.css">
<script src="lang/es.js"></script>
<script src="lang/ca.js"></script>
<script src="lang/gl.js"></script>
<script src="lang/eu.js"></script>
<script src="lang/en.js"></script>
<script src="js/examples.js"></script>
<script src="js/sintaxis.js"></script>
</head>
<body>

<svg class="sprite" aria-hidden="true">
  <symbol id="i-new" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-open" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 19h16"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 17-5-5-6 6-3-3-4 4"/></symbol>
  <symbol id="i-svg" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 19h16"/><text x="12" y="9" text-anchor="middle" font-size="7" stroke="none" fill="currentColor">S</text></symbol>
  <symbol id="i-embed" viewBox="0 0 24 24"><path d="m8 8-5 4 5 4M16 8l5 4-5 4M13.5 5l-3 14"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8"/></symbol>
  <symbol id="i-zoom-in" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M20 20l-3.6-3.6"/></symbol>
  <symbol id="i-zoom-out" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-3.6-3.6"/></symbol>
  <symbol id="i-full" viewBox="0 0 24 24"><path d="M8 3H4a1 1 0 0 0-1 1v4M16 3h4a1 1 0 0 1 1 1v4M8 21H4a1 1 0 0 1-1-1v-4M16 21h4a1 1 0 0 0 1-1v-4"/></symbol>
  <symbol id="i-a11y" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="7.5" r="1.1" stroke="none" fill="currentColor"/><path d="M8 10h8M12 10v4M12 14l-2 4M12 14l2 4"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.3 2.4c-.5.2-.8.7-.8 1.2v.6"/><circle cx="12" cy="17" r=".8" stroke="none" fill="currentColor"/></symbol>
  <symbol id="i-lang" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15 0 18M12 3c-2.5 2.7-2.5 15 0 18"/></symbol>
</svg>

<header class="topbar">
  <div class="brand">
    <img src="favicon.svg" alt="" class="brand-logo" width="28" height="28">
    <div class="brand-text">
      <h1>Sirena</h1>
      <p data-i18n="tagline">Editor libre de diagramas Mermaid</p>
    </div>
  </div>

  <div class="toolbar" role="toolbar">
    <button type="button" id="btn-new" class="tb" data-i18n-title="newDiagram"><svg><use href="#i-new"></use></svg></button>
    <button type="button" id="btn-open" class="tb" data-i18n-title="open"><svg><use href="#i-open"></use></svg></button>
    <div class="menu-wrap">
      <button type="button" id="btn-download" class="tb" data-i18n-title="downloads"><svg><use href="#i-save"></use></svg></button>
      <div class="menu menu-ancho" id="download-menu" hidden>
        <button type="button" data-formato="png"><strong data-i18n="dlPng"></strong><small data-i18n="dlPngD"></small></button>
        <button type="button" data-formato="svg"><strong data-i18n="dlSvg"></strong><small data-i18n="dlSvgD"></small></button>
        <button type="button" data-formato="html"><strong data-i18n="dlHtml"></strong><small data-i18n="dlHtmlD"></small></button>
        <button type="button" data-formato="mmd"><strong data-i18n="dlMmd"></strong><small data-i18n="dlMmdD"></small></button>
      </div>
    </div>
    <input type="file" id="file-input" accept=".mmd,.mermaid,.md,.txt,text/plain" hidden>
    <span class="tb-sep"></span>
    <select id="example-select" class="tb-select" data-i18n-title="chooseExample"></select>
    <select id="theme-select" class="tb-select" data-i18n-title="theme"></select>
    <span class="tb-sep"></span>
    <button type="button" id="btn-copy-code" class="tb" data-i18n-title="copyCode"><svg><use href="#i-copy"></use></svg></button>
    <button type="button" id="btn-copy-image" class="tb" data-i18n-title="copyImage"><svg><use href="#i-image"></use></svg></button>
    <button type="button" id="btn-share" class="tb" data-i18n-title="share"><svg><use href="#i-link"></use></svg></button>
    <button type="button" id="btn-embed" class="tb" data-i18n-title="embed"><svg><use href="#i-embed"></use></svg></button>
    <span class="tb-sep"></span>
    <button type="button" id="btn-a11y" class="tb" data-i18n-title="a11y"><svg><use href="#i-a11y"></use></svg></button>
    <span class="tb-sep"></span>
    <button type="button" id="btn-dark" class="tb" data-i18n-title="darkMode"><svg><use href="#i-moon"></use></svg></button>
    <div class="menu-wrap">
      <button type="button" id="btn-lang" class="tb" data-i18n-title="language"><svg><use href="#i-lang"></use></svg></button>
      <div class="menu" id="lang-menu" hidden></div>
    </div>
    <button type="button" id="btn-help" class="tb" data-i18n-title="help"><svg><use href="#i-help"></use></svg></button>
  </div>
</header>

<nav class="tabs" id="mobile-tabs">
  <button type="button" class="tab active" data-pane="editor" data-i18n="code">Código</button>
  <button type="button" class="tab" data-pane="preview" data-i18n="diagram">Diagrama</button>
</nav>

<main class="workspace" id="workspace">
  <section class="pane pane-editor" id="pane-editor">
    <div class="editor-wrap">
      <div class="gutter" id="gutter" aria-hidden="true"></div>
      <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off" data-i18n-aria="editorLabel"></textarea>
    </div>
    <div class="editor-status" id="editor-status"></div>
  </section>

  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0"></div>

  <section class="pane pane-preview" id="pane-preview">
    <div class="preview-tools">
      <button type="button" id="btn-zoom-out" class="tb" data-i18n-title="zoomOut"><svg><use href="#i-zoom-out"></use></svg></button>
      <button type="button" class="zoom-value" id="zoom-value" data-i18n-title="zoomReset">100 %</button>
      <button type="button" id="btn-zoom-in" class="tb" data-i18n-title="zoomIn"><svg><use href="#i-zoom-in"></use></svg></button>
      <button type="button" id="btn-full" class="tb" data-i18n-title="fullscreen"><svg><use href="#i-full"></use></svg></button>
    </div>
    <div class="preview-viewport" id="viewport">
      <div class="preview-canvas" id="canvas"></div>
    </div>
    <div class="error-box" id="error-box" hidden></div>
    <a class="viewer-link" id="viewer-link" href="#" target="_blank" rel="noopener noreferrer" data-i18n="openInSirena" hidden>Editar en Sirena</a>
  </section>
</main>

<footer class="footer">
  <p class="footer-line">© <a href="https://bilateria.org" target="_blank" rel="noopener noreferrer">Juan José de Haro</a></p>
  <p class="footer-line">
    <span data-i18n="codeLicense">Licencia del código:</span>
    <a href="LICENSE.txt" target="_blank" rel="noopener noreferrer">AGPL v3</a> ·
    <span data-i18n="contentLicense">Contenidos:</span>
    <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.es" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a> ·
    <span data-i18n="poweredBy">Diagramas generados con</span>
    <a href="https://mermaid.js.org/" target="_blank" rel="noopener noreferrer">Mermaid</a>
  </p>
</footer>

<div class="modal-overlay" id="help-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <h2 data-i18n="helpTitle">Cómo funciona</h2>
    <p data-i18n="helpIntro"></p>
    <p data-i18n="helpShare"></p>
    <div class="syntax" id="syntax-box"></div>
    <p><a href="https://mermaid.js.org/intro/syntax-reference.html" target="_blank" rel="noopener noreferrer" data-i18n="helpSyntax">Referencia de la sintaxis de Mermaid</a></p>
    <div class="modal-actions"><button type="button" id="help-close" class="btn" data-i18n="helpClose">Cerrar</button></div>
  </div>
</div>

<div class="modal-overlay" id="a11y-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <h2 data-i18n="a11yHeading">Título y descripción del diagrama</h2>
    <p class="modal-help" data-i18n="a11yHelp"></p>
    <label class="campo">
      <span data-i18n="a11yTitleLabel">Título</span>
      <input type="text" id="a11y-title" autocomplete="off">
    </label>
    <label class="campo">
      <span data-i18n="a11yDescrLabel">Descripción</span>
      <textarea id="a11y-descr" rows="3"></textarea>
    </label>
    <div class="modal-actions">
      <button type="button" id="a11y-cancel" class="btn btn-secundario" data-i18n="cancel">Cancelar</button>
      <button type="button" id="a11y-apply" class="btn" data-i18n="apply">Aplicar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="js/sirena.js"></script>
</body>
</html>
