<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sirena · Editor de diagramas Mermaid</title>
<meta name="description" content="Editor libre de diagramas Mermaid que funciona por completo en el navegador, sin cuenta ni servidor.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/sirena.css">
<script src="lang/es.js"></script>
<script src="lang/ca.js"></script>
<script src="lang/gl.js"></script>
<script src="lang/eu.js"></script>
<script src="lang/en.js"></script>
<script src="js/examples.js"></script>
<script src="js/sintaxis.js"></script>
</head>
<body>

<svg class="sprite" aria-hidden="true">
  <!-- Iconos de Lucide (lucide.dev), licencia ISC. Ver vendor/lucide/LICENSE.txt -->
  <symbol id="i-new" viewBox="0 0 24 24"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" /> <path d="M14 2v5a1 1 0 0 0 1 1h5" /> <path d="M9 15h6" /> <path d="M12 18v-6" /></symbol>
  <symbol id="i-open" viewBox="0 0 24 24"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2" /></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 15V3" /> <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /> <path d="m7 10 5 5 5-5" /></symbol>
  <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z" /> <circle cx="13.5" cy="6.5" r=".5" fill="currentColor" /> <circle cx="17.5" cy="10.5" r=".5" fill="currentColor" /> <circle cx="6.5" cy="12.5" r=".5" fill="currentColor" /> <circle cx="8.5" cy="7.5" r=".5" fill="currentColor" /></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2" /> <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" ry="2" /> <circle cx="9" cy="9" r="2" /> <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" /></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" /> <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" /></symbol>
  <symbol id="i-embed" viewBox="0 0 24 24"><path d="m18 16 4-4-4-4" /> <path d="m6 8-4 4 4 4" /> <path d="m14.5 4-5 16" /></symbol>
  <symbol id="i-a11y" viewBox="0 0 24 24"><circle cx="16" cy="4" r="1" /> <path d="m18 19 1-7-6 1" /> <path d="m5 8 3-3 5.5 3-2.36 3.5" /> <path d="M4.24 14.5a5 5 0 0 0 6.88 6" /> <path d="M13.76 17.5a5 5 0 0 0-6.88-6" /></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" /></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /> <path d="M12 2v2" /> <path d="M12 20v2" /> <path d="m4.93 4.93 1.41 1.41" /> <path d="m17.66 17.66 1.41 1.41" /> <path d="M2 12h2" /> <path d="M20 12h2" /> <path d="m6.34 17.66-1.41 1.41" /> <path d="m19.07 4.93-1.41 1.41" /></symbol>
  <symbol id="i-lang" viewBox="0 0 24 24"><path d="m5 8 6 6" /> <path d="m4 14 6-6 2-3" /> <path d="M2 5h12" /> <path d="M7 2h1" /> <path d="m22 22-5-10-5 10" /> <path d="M14 18h6" /></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /> <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /> <path d="M12 17h.01" /></symbol>
  <symbol id="i-zoom-in" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" /> <line x1="21" x2="16.65" y1="21" y2="16.65" /> <line x1="11" x2="11" y1="8" y2="14" /> <line x1="8" x2="14" y1="11" y2="11" /></symbol>
  <symbol id="i-zoom-out" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" /> <line x1="21" x2="16.65" y1="21" y2="16.65" /> <line x1="8" x2="14" y1="11" y2="11" /></symbol>
  <symbol id="i-full" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3" /> <path d="M21 8V5a2 2 0 0 0-2-2h-3" /> <path d="M3 16v3a2 2 0 0 0 2 2h3" /> <path d="M16 21h3a2 2 0 0 0 2-2v-3" /></symbol>
</svg>

<header class="topbar">
  <div class="brand">
    <img src="favicon.svg" alt="" class="brand-logo" width="28" height="28">
    <div class="brand-text">
      <h1>Sirena</h1>
      <p data-i18n="tagline">Editor libre de diagramas Mermaid</p>
    </div>
  </div>

  <div class="toolbar" role="toolbar">
    <button type="button" id="btn-new" class="tb" data-i18n-title="newDiagram"><svg><use href="#i-new"></use></svg></button>
    <button type="button" id="btn-open" class="tb" data-i18n-title="open"><svg><use href="#i-open"></use></svg></button>
    <div class="menu-wrap">
      <button type="button" id="btn-download" class="tb" data-i18n-title="downloads"><svg><use href="#i-save"></use></svg></button>
      <div class="menu menu-ancho" id="download-menu" hidden>
        <button type="button" data-formato="png"><strong data-i18n="dlPng"></strong><small data-i18n="dlPngD"></small></button>
        <button type="button" data-formato="svg"><strong data-i18n="dlSvg"></strong><small data-i18n="dlSvgD"></small></button>
        <button type="button" data-formato="html"><strong data-i18n="dlHtml"></strong><small data-i18n="dlHtmlD"></small></button>
        <button type="button" data-formato="mmd"><strong data-i18n="dlMmd"></strong><small data-i18n="dlMmdD"></small></button>
      </div>
    </div>
    <input type="file" id="file-input" accept=".mmd,.mermaid,.md,.txt,text/plain" hidden>
    <span class="tb-sep"></span>
    <select id="example-select" class="tb-select" data-i18n-title="chooseExample"></select>
    <select id="theme-select" class="tb-select" data-i18n-title="theme"></select>
    <div class="menu-wrap">
      <button type="button" id="btn-appearance" class="tb" data-i18n-title="appearance"><svg><use href="#i-palette"></use></svg></button>
      <div class="menu menu-ajustes" id="appearance-menu" hidden>
        <label class="ajuste" id="ajuste-direction"><span data-i18n="direction"></span><select id="direction-select"></select></label>
        <label class="ajuste"><span data-i18n="look"></span><select id="look-select"></select></label>
        <label class="ajuste"><span data-i18n="fontSize"></span><select id="size-select"></select></label>
        <label class="ajuste"><span data-i18n="color"></span><select id="color-select"></select>
        </label>
        <div class="colores-propios" id="colores-propios" hidden>
          <label class="color-fila"><span data-i18n="colorFill"></span><input type="color" id="color-fill" value="#d0ebff"></label>
          <label class="color-fila"><span data-i18n="colorBorder"></span><input type="color" id="color-border" value="#1971c2"></label>
          <label class="color-fila"><span data-i18n="colorLine"></span><input type="color" id="color-line" value="#1971c2"></label>
          <label class="color-fila"><span data-i18n="colorText"></span><input type="color" id="color-text" value="#17262b"></label>
          <p class="ajuste-nota" data-i18n="colorHint"></p>
        </div>
        <label class="ajuste" id="ajuste-curve"><span data-i18n="curve"></span><select id="curve-select"></select></label>
        <label class="ajuste" id="ajuste-spacing"><span data-i18n="spacing"></span><select id="spacing-select"></select></label>
        <label class="ajuste" id="ajuste-numbering"><span data-i18n="numbering"></span><select id="numbering-select"></select></label>
        <label class="ajuste" id="ajuste-showdata"><span data-i18n="showData"></span><select id="showdata-select"></select></label>
        <p class="ajuste-nota" id="nota-flujo" data-i18n="onlyFlow"></p>
      </div>
    </div>
    <span class="tb-sep"></span>
    <button type="button" id="btn-copy-code" class="tb" data-i18n-title="copyCode"><svg><use href="#i-copy"></use></svg></button>
    <button type="button" id="btn-copy-image" class="tb" data-i18n-title="copyImage"><svg><use href="#i-image"></use></svg></button>
    <button type="button" id="btn-share" class="tb" data-i18n-title="share"><svg><use href="#i-link"></use></svg></button>
    <button type="button" id="btn-embed" class="tb" data-i18n-title="embed"><svg><use href="#i-embed"></use></svg></button>
    <span class="tb-sep"></span>
    <button type="button" id="btn-a11y" class="tb" data-i18n-title="a11y"><svg><use href="#i-a11y"></use></svg></button>
    <span class="tb-sep"></span>
    <button type="button" id="btn-dark" class="tb" data-i18n-title="darkMode"><svg><use href="#i-moon"></use></svg></button>
    <div class="menu-wrap">
      <button type="button" id="btn-lang" class="tb" data-i18n-title="language"><svg><use href="#i-lang"></use></svg></button>
      <div class="menu" id="lang-menu" hidden></div>
    </div>
    <button type="button" id="btn-help" class="tb" data-i18n-title="help"><svg><use href="#i-help"></use></svg></button>
  </div>
</header>

<nav class="tabs" id="mobile-tabs">
  <button type="button" class="tab active" data-pane="editor" data-i18n="code">Código</button>
  <button type="button" class="tab" data-pane="preview" data-i18n="diagram">Diagrama</button>
</nav>

<main class="workspace" id="workspace">
  <section class="pane pane-editor" id="pane-editor">
    <div class="editor-wrap">
      <div class="gutter" id="gutter" aria-hidden="true"></div>
      <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off" data-i18n-aria="editorLabel"></textarea>
    </div>
    <div class="editor-status" id="editor-status"></div>
  </section>

  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0"></div>

  <section class="pane pane-preview" id="pane-preview">
    <div class="preview-tools">
      <button type="button" id="btn-zoom-out" class="tb" data-i18n-title="zoomOut"><svg><use href="#i-zoom-out"></use></svg></button>
      <button type="button" class="zoom-value" id="zoom-value" data-i18n-title="zoomReset">100 %</button>
      <button type="button" id="btn-zoom-in" class="tb" data-i18n-title="zoomIn"><svg><use href="#i-zoom-in"></use></svg></button>
      <button type="button" id="btn-full" class="tb" data-i18n-title="fullscreen"><svg><use href="#i-full"></use></svg></button>
    </div>
    <div class="preview-viewport" id="viewport">
      <div class="preview-canvas" id="canvas"></div>
    </div>
    <div class="error-box" id="error-box" hidden></div>
    <a class="viewer-link" id="viewer-link" href="#" target="_blank" rel="noopener noreferrer" data-i18n="openInSirena" hidden>Editar en Sirena</a>
  </section>
</main>

<footer class="footer">
  <p class="footer-line">
    © <a href="https://bilateria.org" target="_blank" rel="noopener noreferrer">Juan José de Haro</a> ·
    <span data-i18n="codeLicense">Licencia del código:</span>
    <a href="LICENSE.txt" target="_blank" rel="noopener noreferrer">AGPL v3</a> ·
    <span data-i18n="contentLicense">Contenidos:</span>
    <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.es" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a> ·
    <span data-i18n="poweredBy">Diagramas generados con</span>
    <a href="https://mermaid.js.org/" target="_blank" rel="noopener noreferrer">Mermaid</a>
  </p>
</footer>

<div class="modal-overlay" id="help-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <h2 data-i18n="helpTitle">Cómo funciona</h2>
    <p data-i18n="helpIntro"></p>
    <p data-i18n="helpShare"></p>
    <div class="syntax" id="syntax-box"></div>
    <p><a href="https://mermaid.js.org/intro/syntax-reference.html" target="_blank" rel="noopener noreferrer" data-i18n="helpSyntax">Referencia de la sintaxis de Mermaid</a></p>
    <div class="modal-actions"><button type="button" id="help-close" class="btn" data-i18n="helpClose">Cerrar</button></div>
  </div>
</div>

<div class="modal-overlay" id="a11y-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <h2 data-i18n="a11yHeading">Título y descripción del diagrama</h2>
    <p class="modal-help" data-i18n="a11yHelp"></p>
    <label class="campo">
      <span data-i18n="a11yTitleLabel">Título</span>
      <input type="text" id="a11y-title" autocomplete="off">
    </label>
    <label class="campo">
      <span data-i18n="a11yDescrLabel">Descripción</span>
      <textarea id="a11y-descr" rows="3"></textarea>
    </label>
    <div class="modal-actions">
      <button type="button" id="a11y-cancel" class="btn btn-secundario" data-i18n="cancel">Cancelar</button>
      <button type="button" id="a11y-apply" class="btn" data-i18n="apply">Aplicar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="js/sirena.js"></script>
</body>
</html>
