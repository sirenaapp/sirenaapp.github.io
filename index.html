        <button type="button" id="btn-stroke" class="tb" data-i18n-title="strokeMenu"><svg><use href="#i-brush"></use></svg></button>
        <div class="menu menu-izq menu-ajustes" id="stroke-menu" hidden>
          <label class="ajuste"><svg aria-hidden="true"><use href="#i-brush"></use></svg><span data-i18n="look"></span><select id="look-select"></select></label>
        </div>
      </div>
      <div class="menu-wrap">
        <button type="button" id="btn-size" class="tb" data-i18n-title="fontSize"><svg><use href="#i-text-size"></use></svg></button>
        <div class="menu menu-izq menu-opciones menu-tamano" id="size-menu" hidden>
          <p class="menu-titulo" data-i18n="fontSize"></p>
          <div id="size-options"></div>
          <label class="tamano-propio"><span data-i18n="sizeCustom"></span><input type="number" id="size-custom" min="8" max="72" step="1" inputmode="numeric"><span>px</span></label>
        </div>
      </div>
      <span class="tb-sep" id="sep-ajustes" hidden></span>
      <div class="menu-wrap" id="wrap-lines" hidden>
        <button type="button" id="btn-lines" class="tb" data-i18n-title="lines"><svg><use href="#i-spline"></use></svg></button>
        <div class="menu menu-izq menu-ajustes" id="lines-menu" hidden>
          <p class="menu-seccion" data-i18n="linesAll"></p>
          <label class="ajuste" id="ajuste-curve"><svg aria-hidden="true"><use href="#i-spline"></use></svg><span data-i18n="curve"></span><select id="curve-select"></select></label>
          <label class="ajuste"><svg aria-hidden="true"><use href="#i-arrow-right"></use></svg><span data-i18n="arrowWidth"></span><select id="arrow-width-select"></select></label>
          <label class="tamano-propio"><span data-i18n="widthCustom"></span><input type="number" id="arrow-width-custom" min="0.5" max="20" step="0.5" inputmode="decimal"><span>px</span></label>
          <label class="ajuste"><svg aria-hidden="true"><use href="#i-frame"></use></svg><span data-i18n="borderWidth"></span><select id="border-width-select"></select></label>
          <label class="tamano-propio"><span data-i18n="widthCustom"></span><input type="number" id="border-width-custom" min="0.5" max="20" step="0.5" inputmode="decimal"><span>px</span></label>
          <div class="color-elemento" id="line-target-box">
            <p class="menu-seccion" data-i18n="linesHere"></p>
            <p class="menu-titulo" id="line-target"></p>
            <div class="segmentos" id="line-partes">
              <button type="button" data-parte="flecha" data-i18n="nodeColorLink"></button>
              <button type="button" data-parte="borde" data-i18n="lineBorder"></button>
            </div>
            <div class="segmentos" id="line-widths"></div>
            <div id="line-width-custom"></div>
          </div>
        </div>
      </div>
      <div class="menu-wrap" id="wrap-shape" hidden>
        <button type="button" id="btn-shape" class="tb" data-i18n-title="shapeBtn"><svg><use href="#i-square"></use></svg></button>
      </div>
      <div class="menu-wrap" id="wrap-spacing" hidden>
        <button type="button" id="btn-spacing" class="tb" data-i18n-title="spacing"><svg><use href="#i-distribute"></use></svg></button>
        <div class="menu menu-izq menu-opciones" id="menu-spacing" data-select="spacing-select" hidden></div>
      </div>
      <div class="menu-wrap" id="wrap-padding" hidden>
        <button type="button" id="btn-padding" class="tb" data-i18n-title="padding"><svg><use href="#i-frame"></use></svg></button>
        <div class="menu menu-izq menu-opciones" id="menu-padding" data-select="padding-select" hidden></div>
      </div>
      <div class="menu-wrap" id="wrap-merge" hidden>
        <button type="button" id="btn-merge" class="tb" data-i18n-title="merge" aria-pressed="false"><svg><use href="#i-merge"></use></svg></button>
      </div>
      <div class="menu-wrap" id="wrap-numbering" hidden>
        <button type="button" id="btn-numbering" class="tb" data-i18n-title="numbering"><svg><use href="#i-list-ordered"></use></svg></button>
        <div class="menu menu-izq menu-opciones" id="menu-numbering" data-select="numbering-select" hidden></div>
      </div>
      <div class="menu-wrap" id="wrap-showdata" hidden>
        <button type="button" id="btn-showdata" class="tb" data-i18n-title="showData"><svg><use href="#i-hash"></use></svg></button>
        <div class="menu menu-izq menu-opciones" id="menu-showdata" data-select="showdata-select" hidden></div>
      </div>
      <span class="tb-sep"></span>
      <button type="button" id="btn-a11y" class="tb" data-i18n-title="a11y"><svg><use href="#i-a11y"></use></svg></button>
      <button type="button" id="btn-help" class="tb" data-i18n-title="help"><svg><use href="#i-help"></use></svg></button>
      <span class="tb-sep tb-fin"></span>
      <button type="button" id="btn-undo" class="tb" data-i18n-title="undo" disabled><svg><use href="#i-undo"></use></svg></button>
      <button type="button" id="btn-redo" class="tb" data-i18n-title="redo" disabled><svg><use href="#i-redo"></use></svg></button>
      <div hidden>
        <select id="engine-select"></select>
        <select id="size-select"></select>
        <select id="spacing-select"></select>
        <select id="padding-select"></select>
        <select id="merge-select"></select>
        <select id="numbering-select"></select>
        <select id="showdata-select"></select>
      </div>
    </div>
    <div class="editor-wrap">
      <div class="gutter" id="gutter" aria-hidden="true"></div>
      <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off" data-i18n-aria="editorLabel"></textarea>
    </div>
    <div class="editor-status">
      <button type="button" id="doc-name" class="doc-name" data-i18n-title="rename"></button>
      <span id="editor-status"></span>
    </div>
  </section>

  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0"></div>

  <section class="pane pane-preview" id="pane-preview">
    <div class="preview-tools">
      <button type="button" id="btn-zoom-out" class="tb" data-i18n-title="zoomOut"><svg><use href="#i-zoom-out"></use></svg></button>
      <button type="button" class="zoom-value" id="zoom-value" data-i18n-title="zoomReset">100 %</button>
      <button type="button" id="btn-zoom-in" class="tb" data-i18n-title="zoomIn"><svg><use href="#i-zoom-in"></use></svg></button>
      <button type="button" id="btn-full" class="tb" data-i18n-title="fullscreen"><svg><use href="#i-full"></use></svg></button>
    </div>
    <div class="preview-viewport" id="viewport">
      <div class="preview-canvas" id="canvas"></div>
    </div>
    <div class="pista" id="pista-formato" hidden>
      <svg aria-hidden="true"><use href="#i-pointer"></use></svg>
      <span id="pista-formato-texto"></span>
      <button type="button" id="pista-formato-cerrar" data-i18n-title="hintClose"><svg aria-hidden="true"><use href="#i-close"></use></svg></button>
    </div>
    <div class="error-box" id="error-box" hidden></div>
    <a class="viewer-link" id="viewer-link" href="#" target="_blank" rel="noopener noreferrer" data-i18n="openInSirena" hidden>Editar en Sirena</a>
  </section>
</main>

<div class="menu menu-contextual" id="context-menu" hidden></div>

<div class="modal-overlay" id="shape-modal" hidden>
  <div class="modal modal-formas" role="dialog" aria-modal="true">
    <h2 data-i18n="ctxShape">Forma de la caja</h2>
    <div id="shape-grid"></div>
    <div class="modal-actions"><button type="button" id="shape-close" class="btn" data-i18n="helpClose">Cerrar</button></div>
  </div>
</div>

<div class="modal-overlay" id="help-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <h2 data-i18n="helpTitle">Cómo funciona</h2>
    <p data-i18n="helpIntro"></p>
    <p data-i18n="helpShare"></p>
    <div class="syntax" id="syntax-box"></div>
    <p><a href="https://mermaid.js.org/intro/syntax-reference.html" target="_blank" rel="noopener noreferrer" data-i18n="helpSyntax">Referencia de la sintaxis de Mermaid</a></p>
    <div class="modal-actions"><button type="button" id="help-close" class="btn" data-i18n="helpClose">Cerrar</button></div>
  </div>
</div>

<div class="modal-overlay" id="a11y-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <h2 data-i18n="a11yHeading">Título y descripción del diagrama</h2>
    <p class="modal-help" data-i18n="a11yHelp"></p>
    <p class="modal-help modal-aviso" id="a11y-comment-note" data-i18n="a11yComment" hidden></p>
    <label class="campo">
      <span data-i18n="a11yTitleLabel">Título</span>
      <input type="text" id="a11y-title" autocomplete="off">
    </label>
    <label class="campo">
      <span data-i18n="a11yDescrLabel">Descripción</span>
      <textarea id="a11y-descr" rows="3"></textarea>
    </label>
    <div class="modal-actions">
      <button type="button" id="a11y-cancel" class="btn btn-secundario" data-i18n="cancel">Cancelar</button>
      <button type="button" id="a11y-apply" class="btn" data-i18n="apply">Aplicar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="library-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <h2 data-i18n="libraryHeading">Mis diagramas</h2>
    <p class="modal-help" data-i18n="libraryHelp"></p>
    <div class="lista-cabecera" id="lista-cabecera" hidden>
      <label class="marca-todos"><input type="checkbox" id="marcar-todos"><span data-i18n="selectAll"></span></label>
      <button type="button" id="borrar-marcados" class="btn btn-secundario btn-peligro" disabled><svg><use href="#i-trash"></use></svg><span id="borrar-marcados-texto"></span></button>
    </div>
    <ul class="lista-docs" id="lista-docs"></ul>
    <label class="ajuste" id="ajuste-limite" data-i18n-title="docLimitHelp"><span data-i18n="docLimit"></span><select id="limit-select"></select></label>
    <p class="modal-help" data-i18n="backupHelp"></p>
    <input type="file" id="backup-input" accept=".json,application/json" hidden>
    <div class="modal-actions modal-actions-repartidas">
      <div class="acciones-izq">
        <button type="button" id="backup-export" class="btn btn-secundario" data-i18n="backupExport">Exportar copia</button>
        <button type="button" id="backup-import" class="btn btn-secundario" data-i18n="backupImport">Importar copia</button>
      </div>
      <button type="button" id="library-close" class="btn" data-i18n="helpClose">Cerrar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="js/sirena.js"></script>
</body>
</html>
